<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- LOGIN OVERLAY -->
<div class="login-overlay" id="loginOverlay"></div>


<!-- LOGIN POPUP -->
<div class="login-popup" id="loginPopup">

    <!-- CLOSE BUTTON -->
    <button
        class="login-close"
        id="closeLoginBtn"
        type="button">
        &times;
    </button>


    <!-- TITLE -->
    <div class="login-title">
        <h2>Welcome Back</h2>

        <p>
            Login to your CleanCare account
        </p>
    </div>


    <!-- FORM -->
    <form id="loginForm">

        <div class="login-field">

            <label for="loginEmail">
                Email
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

        </div>


        <div class="login-field">

            <label for="loginPassword">
                Password
            </label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

        </div>


        <div class="login-options">

            <label>
                <input type="checkbox">
                Remember me
            </label>

            <a href="#">
                Forgot Password?
            </a>

        </div>


        <button
            type="submit"
            class="login-submit">
            Login
        </button>

    </form>
    
    <div class="login-signup">
        Don't have an account?
        <a href="#">Sign Up</a>
    </div>

</div>
</body>
</html>
